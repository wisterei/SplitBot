services:
  bot:
    build: .
    container_name: splitwise-bot
    restart: unless-stopped
    # Сеть хоста: контейнер видит прокси на 127.0.0.1 (xray). Порты бот не открывает.
    network_mode: host
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/splitwise.db
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
